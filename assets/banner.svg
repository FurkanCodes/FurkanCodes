<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Furkan Turkoglu - software developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.55" stop-color="#150f2e"/>
      <stop offset="1" stop-color="#0a1c2c"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee7ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#ff5fc8" stop-opacity="0.35"/><stop offset="1" stop-color="#ff5fc8" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#dots)"/>
    <circle r="230" fill="url(#g1)"><animate attributeName="cx" values="120;300;120" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="60;250;60" dur="11s" repeatCount="indefinite"/></circle>
    <circle r="260" fill="url(#g2)"><animate attributeName="cx" values="880;650;880" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="260;40;260" dur="13s" repeatCount="indefinite"/></circle>
    <circle r="190" fill="url(#g3)"><animate attributeName="cx" values="520;760;520" dur="18s" repeatCount="indefinite"/><animate attributeName="cy" values="40;180;40" dur="15s" repeatCount="indefinite"/></circle>

    <!-- window dots -->
    <circle cx="60" cy="52" r="6" fill="#ff5f57"/><circle cx="80" cy="52" r="6" fill="#febc2e"/><circle cx="100" cy="52" r="6" fill="#28c840"/>
    <text x="940" y="57" text-anchor="end" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#6e7681">~/furkan</text>

    <text x="56" y="140" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#8b949e">hi, i'm</text>
    <text x="150" y="141" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#name)" letter-spacing="-1">Furkan Turkoglu</text>

    <text x="42" y="198" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" fill="#7ee7ff">&gt;<animate attributeName="opacity" values="1;1;0.25;1" keyTimes="0;0.6;0.8;1" dur="1.4s" repeatCount="indefinite"/></text>
    <text x="60" y="198" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" fill="#c9d1d9" opacity="0">
      native apps for Mac, Android &amp; Windows
      <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite"
        keyTimes="0;0.03;0.22;0.25;1" values="0;1;1;0;0"/>
      <animate attributeName="x" dur="12s" begin="0s" repeatCount="indefinite"
        keyTimes="0;0.03;1" values="48;60;60"/>
    </text><text x="60" y="198" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" fill="#c9d1d9" opacity="0">
      Swift  ·  Kotlin  ·  Rust  ·  C#  ·  TypeScript
      <animate attributeName="opacity" dur="12s" begin="3s" repeatCount="indefinite"
        keyTimes="0;0.03;0.22;0.25;1" values="0;1;1;0;0"/>
      <animate attributeName="x" dur="12s" begin="3s" repeatCount="indefinite"
        keyTimes="0;0.03;1" values="48;60;60"/>
    </text><text x="60" y="198" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" fill="#c9d1d9" opacity="0">
      tools I actually use, shipped for real
      <animate attributeName="opacity" dur="12s" begin="6s" repeatCount="indefinite"
        keyTimes="0;0.03;0.22;0.25;1" values="0;1;1;0;0"/>
      <animate attributeName="x" dur="12s" begin="6s" repeatCount="indefinite"
        keyTimes="0;0.03;1" values="48;60;60"/>
    </text><text x="60" y="198" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" fill="#c9d1d9" opacity="0">
      building from Turkiye
      <animate attributeName="opacity" dur="12s" begin="9s" repeatCount="indefinite"
        keyTimes="0;0.03;0.22;0.25;1" values="0;1;1;0;0"/>
      <animate attributeName="x" dur="12s" begin="9s" repeatCount="indefinite"
        keyTimes="0;0.03;1" values="48;60;60"/>
    </text>

    <!-- accent line -->
    <rect x="60" y="256" width="880" height="2" rx="1" fill="url(#name)" opacity="0.55"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>